name: daily-news

on:
  schedule:
    - cron: '0 22 * * *' # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: daily-news

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # 소식은 main에 바로 올리지 않는다. news-review 가지에 쌓고, 사람이 확인해 합친 것만 공개된다.
      - name: 검토용 가지 준비
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin news-review >/dev/null; then
            git checkout news-review
            git merge --no-edit origin/main
          else
            git checkout -b news-review
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: 수집·요약
        run: npm run collect
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
      # 형식이 깨진 글이 main에 들어가 사이트 빌드를 막는 일이 없게 먼저 빌드해 본다.
      - run: npm run build
      - name: 검토 요청 올리기
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add src/content/news blocked-urls.txt
          git diff --cached --quiet || git commit -m "chore(news): $(TZ=Asia/Seoul date +%F) 검토 대기"
          git push -u origin news-review
          if [ -z "$(git diff --name-only origin/main...HEAD -- src/content/news)" ]; then
            echo "검토할 새 글 없음"
            exit 0
          fi
          if [ -z "$(gh pr list --head news-review --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head news-review \
              --title "소식 검토 ($(TZ=Asia/Seoul date +%F)부터)" \
              --body-file .github/news-review.md \
              || echo "::warning::검토 요청을 자동으로 열지 못했습니다. 이 주소에서 직접 여세요: https://github.com/${{ github.repository }}/compare/main...news-review?expand=1"
          fi
